<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Domnotate — store promo tile 440x280</title>

<!--
  The Chrome Web Store's mandatory small promotional tile, 440x280.

  Rendered in a browser rather than through rsvg-convert because the wordmark has
  to resolve through Geist and Lora, which are not installed locally. It imports
  them from the same source src/styles/reset.css does.

  Store rules this satisfies: opaque, full bleed, square corners, no screenshot
  inside it, light on text.

  The wordmark's tracking, colours and gap match .dn-landing__title in
  src/loader/drop-zone.css. Keep them in step.

  The mark between the markers below is written by `npm run mark`; do not edit it
  here. Screenshot the .tile element at exactly 440x280 to produce
  docs/store-assets/promo-440x280.png, which is gitignored.
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #3b3b3b; display: grid; place-items: center; min-height: 100vh; }

  .tile {
    width: 440px;
    height: 280px;
    background: #FAF7F2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    overflow: hidden;
  }

  .mark { width: 104px; height: 104px; display: block; }

  /* font-size lives here so `gap` in em resolves against 42px, not the parent's. */
  .wordmark {
    display: flex;
    align-items: baseline;
    font-size: 42px;
    /* Matches the landing page's 0.111em. */
    gap: 0.111em;
    line-height: 1;
  }
  .wordmark .dom {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 1em;
    font-weight: 800;
    letter-spacing: -0.028em;
    color: #2C2016;
  }
  .wordmark .notate {
    font-family: 'Lora', Georgia, serif;
    font-size: 1em;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.014em;
    color: #6B5D4F;
  }

  .line {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #6B5D4F;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="tile">
    <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <!-- mark:start -->
      <rect x="0" y="0" width="128" height="128" rx="32" fill="#C4725A"/>
      <line x1="18.56" y1="12.8" x2="109.44" y2="12.8" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="25.6" x2="109.44" y2="25.6" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="38.4" x2="63.49" y2="38.4" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="94.05" y1="38.4" x2="109.44" y2="38.4" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="51.2" x2="64.59" y2="51.2" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="90.51" y1="51.2" x2="109.44" y2="51.2" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="64" x2="56.38" y2="64" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="70.8" y1="64" x2="109.44" y2="64" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="76.8" x2="48.17" y2="76.8" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="61.94" y1="76.8" x2="109.44" y2="76.8" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="89.6" x2="41.45" y2="89.6" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="51.6" y1="89.6" x2="109.44" y2="89.6" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="102.4" x2="109.44" y2="102.4" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <line x1="18.56" y1="115.2" x2="109.44" y2="115.2" stroke="#FAF7F2" stroke-opacity="0.14" stroke-width="2.34" stroke-linecap="round"/>
      <path d="M 38.16 102.16 L 55.69 81.84 L 50.16 78.16 L 38.16 102.16 Z" fill="#FAF7F2"/>
      <circle cx="52.93" cy="80" r="3.32" fill="#FAF7F2"/>
      <path d="M 55.69 81.84 L 75.89 52.64 L 69.34 48.27 L 50.16 78.16 Z" fill="#FAF7F2"/>
      <circle cx="72.61" cy="50.46" r="3.94" fill="#FAF7F2"/>
      <circle cx="78.77" cy="41.84" r="12.93" fill="#2C2016"/>
      <!-- mark:end -->
    </svg>

    <div class="wordmark">
      <span class="dom">DOM</span><span class="notate">notate</span>
    </div>

    <div class="line">Click anything. Write a note. Paste it to your agent.</div>
  </div>
</body>
</html>
