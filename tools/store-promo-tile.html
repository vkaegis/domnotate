<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Domnotate — store promo tile 440x280</title>

<!--
  The Chrome Web Store's mandatory small promotional tile, 440x280.

  Rendered in the browser rather than as an SVG through rsvg-convert so the
  wordmark resolves through the same font stack as the live landing page. That
  matters here: neither Geist Sans nor Lora is actually installed on this
  machine, so the site already falls back to the system grotesque and Georgia
  italic. Matching the fallback is matching the brand as people see it; an SVG
  rasterised against a different stack would ship a wordmark the site never
  renders.

  Store rules this satisfies: opaque and full-bleed with square corners, no
  screenshot inside it, and light on text — a mark, a wordmark, one line.

  Screenshot the .tile element at exactly 440x280.
-->

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #3b3b3b; display: grid; place-items: center; min-height: 100vh; }

  .tile {
    width: 440px;
    height: 280px;
    background: #FAF7F2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    /* A warm bloom off the top-right, where the mark's pin sits. Depth with an
       offset and a soft spread, never a flat halo. */
    background-image: radial-gradient(120% 90% at 78% 6%, rgba(196, 114, 90, 0.13), rgba(196, 114, 90, 0) 62%);
    overflow: hidden;
  }

  .mark { width: 60px; height: 60px; display: block; }

  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 1px;
    line-height: 1;
  }
  .wordmark .dom {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.045em;
    color: #2C2016;
  }
  .wordmark .notate {
    font-family: 'Lora', Georgia, serif;
    font-size: 42px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #7A6B5A;
  }

  .line {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #7A6B5A;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="tile">
    <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <rect x="16" y="16" width="96" height="96" rx="22" fill="#C4725A"/>
      <rect x="29" y="47" width="52" height="52" rx="10" fill="#FFFFFF"/>
      <circle cx="83" cy="45" r="16" fill="#FAF7F2"/>
      <circle cx="83" cy="45" r="7" fill="#C4725A"/>
    </svg>

    <div class="wordmark">
      <span class="dom">DOM</span><span class="notate">notate</span>
    </div>

    <div class="line">Click anything. Write a note. Paste it to your agent.</div>
  </div>
</body>
</html>
